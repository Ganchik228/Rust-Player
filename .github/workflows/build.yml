name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libasound2-dev libxcb1-dev libxrandr-dev libxss-dev libxcursor-dev libxcomposite-dev libxdamage-dev libxfixes-dev libxinerama-dev libxi-dev libxrender-dev libxkbfile-dev libxkbcommon-dev libwayland-dev libdbus-1-dev libgtk-3-dev
        
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Check formatting
      run: cargo fmt -- --check
      
    - name: Check clippy
      run: cargo clippy -- -D warnings
      
    - name: Build project
      run: cargo build --release
      
    - name: Run tests
      run: cargo test
      
    - name: Upload Linux binary
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: linux-binary
        path: target/release/PrakRust
        
    - name: Upload Windows binary
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: windows-binary
        path: target/release/PrakRust.exe
        
    - name: Upload macOS binary
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: macos-binary
        path: target/release/PrakRust